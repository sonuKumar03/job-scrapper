services:
  db:
    image: postgres:16-alpine
    container_name: job_scrapper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: job_scrapper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_scrapper"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@db:5432/job_scrapper
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m job_scrapper.companies.bootstrap"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: job_scrapper_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@db:5432/job_scrapper
      - SCRAPE_EXECUTOR=${SCRAPE_EXECUTOR:-memory}
      - SCRAPE_BROKER_URL=redis://redis:6379/0
      - SCRAPE_MAX_ACTIVE_RUNS=${SCRAPE_MAX_ACTIVE_RUNS:-3}
      - SCRAPE_MAX_QUEUED_RUNS=${SCRAPE_MAX_QUEUED_RUNS:-20}
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >
      job-scrapper api --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: job_scrapper_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://api:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    profiles: [broker]
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'always', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    profiles: [broker]
    restart: unless-stopped
    stop_grace_period: 75s
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@db:5432/job_scrapper
      - SCRAPE_EXECUTOR=broker
      - SCRAPE_BROKER_URL=redis://redis:6379/0
      - SCRAPE_MAX_ACTIVE_RUNS=${SCRAPE_MAX_ACTIVE_RUNS:-3}
      - SCRAPE_MAX_QUEUED_RUNS=${SCRAPE_MAX_QUEUED_RUNS:-20}
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: >
      job-scrapper worker

volumes:
  pgdata:
  redisdata:
