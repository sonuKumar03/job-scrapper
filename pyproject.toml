[project]
name = "job-scrapper"
version = "0.1.0"
description = "High-volume job scraper and ML dataset generator"
readme = "readme.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "curl-cffi>=0.7.0",
    "selectolax>=0.3.21",
    "dateparser>=1.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "greenlet>=3.5.6",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44.0",
]
export = [
    "pyarrow>=25.0.1",
]
web = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]
broker = [
    "redis>=8.1.0",
]

[project.scripts]
job-scrapper = "job_scrapper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scrapper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
